# ════════════════════════════════════════════
# Polling stratégia
# ════════════════════════════════════════════
# priority 1 = percenként (real-time)
# priority 2 = 5 percenként
# priority 3 = 30 percenként
# priority 4 = óránként
#
# Becsült volumen:
# - 30 RSS source × ~3 új item/nap = 90 RSS item/nap
# - 17 Twitter handle × ~5 tweet/nap = 85 tweet/nap
# - 5 LinkedIn source × ~1 post/nap = 5 post/nap
# Összesen: ~180 új elem/nap
# Szűrés után: ~10-15 valóban releváns
# Generálás: ~3-5 posztra való hír/nap
