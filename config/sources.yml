# Figyelendő források — full lista
# Kategóriánként, prioritással (1=legmagasabb)
#
# Per-source mezők (RSS):
#   url               kötelező
#   priority          1-4 (1=legmagasabb)
#   poll_interval_sec polling gyakoriság
#   tags              címkék
#   max_items         opcionális — hány elemet tartunk meg (default: 50)
#   enabled           opcionális — false esetén a collector kihagyja (DISABLED)
#   previously_broken opcionális — true: korábban hibás volt; ha most működik -> FIXED

