[project]
name = "plansmart-content"
version = "0.1.0"
description = "Realtime AI-powered content generator for 3 LinkedIn accounts and X"
authors = [
    { name = "Jécsai Dávid", email = "david@plansmart.live" },
    { name = "Nagy Ádám" },
]
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
# scripts/ = kézi, ÉLES smoke-toolok (valódi API-t + pénzt hívnak, nem CI-teszt); szándékos
# mintákkal (sys.path-boot import ELŐTT → E402). A CI-gate a shippelő kódra (src) + a
# tesztekre (tests) vonatkozik, a live scripteket nem lintoljuk/formázzuk automatikusan.
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
# Third-party libs ship no stubs (aiogram, supabase, feedparser, rembg, apscheduler…).
ignore_missing_imports = true
# Imported-but-not-yet-strict modules are followed silently so each batch stays scoped.
follow_imports = "silent"
# Global-only strictness flags (not permitted in per-module overrides). Harmless on the
# lenient baseline; they mainly bite once a module opts into annotations below.
warn_redundant_casts = true
warn_unused_configs = true
extra_checks = true

# Strict typing is enforced across the whole src tree (Phase 2 complete):
#   Batch 2A → src.core.* + src.utils.*
#   Batch 2B → src.ai.*   + src.integrations.*
# `disallow_untyped_calls` is enabled repo-wide now that the entire call graph is typed —
# roughly equivalent to `--strict` for src.*, minus a couple global-only flags set above.
[[tool.mypy.overrides]]
module = ["src.core.*", "src.utils.*", "src.ai.*", "src.integrations.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_reexport = true
strict_equality = true
